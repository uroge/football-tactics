<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="747" viewBox="0 0 1080 747" role="img" aria-labelledby="title description">
<title id="title">Football Tactics system architecture</title>
<desc id="description">The Android TV capture service samples frames from compatible playback. A WebSocket sends binary frames to FastAPI on the Mac. Detection, tracking, team classification and pitch calibration feed tactical analysis. JSON annotations return to the TV for freshness and alignment checks, then a Canvas overlay draws over the original playback.</desc>
